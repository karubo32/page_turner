# Leave the Pirate Audio DAC to ALSA (~/.config/alsa/asoundrc dmix). Name differs on Pi 4 and Pi 5.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-soc_sound" }
      { device.name = "~alsa_card.platform-soc_.*_sound" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
